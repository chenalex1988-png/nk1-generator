# NK1 結果陳述詞表（工單【M5.4】B；品保 2026-09-30 回函 2-1）— 計畫類文件**所有節**（固定文節除外）逐句掃
# 一句含 terms／patterns 任一 → 結果陳述，攔該節；除非該句為規範式（normative，允收標準句型白名單）。
# 另：同句含日期＋「核准」→ 核准日進敘述句，攔（核准日只進計畫核准表格欄位）。
version: 1
terms:
  - "獲得正式核准"
  - "獲得核准"
  - "已獲核准"
  - "已核准"
  - "均符合"
  - "符合規定"
  - "無中斷"
  - "記錄為合格"
  - "判定合格"
  - "已完成"
patterns:
  - "獲得.{0,4}核准"
  - "偏離(件數)?(為)?\\s*\\d+\\s*件"
  - "偏離\\s*0(?!\\s*[≤<件])"
  - "依(據)?.{0,15}結果"
  - "符合.{0,60}之(規定|要求)"
  - "完成(?!後)"
  - "參數穩定(?!性)"
normative:
  - "應\\s*[≤<≥>]"
  - "應為"
  - "不得超過"
  - "須於.{0,20}內"
  - "允收[：:]"
date_approval: "\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}.{0,30}核准|核准.{0,30}\\d{4}[-/]\\d{1,2}[-/]\\d{1,2}"
